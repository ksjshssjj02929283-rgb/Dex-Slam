syntax = "proto3";

package cartographer.preprocess.proto;

message DataPreprocessorOptions {
  // Rangefinder points outside these ranges will be dropped.
  float min_range = 1;
  float max_range = 2;

  // Points beyond 'max_range' will be inserted with this length as empty space.
  float missing_data_ray_length = 3;

  // If true, the rangefinder data will be deskewed.
  bool use_deskew = 4;
  bool use_odometry = 5;

  // Number of range data to accumulate into one unwarped, combined range data
  // to use for scan matching.
  int32 num_accumulated_range_data = 6;

}
