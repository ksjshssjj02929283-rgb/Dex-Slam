syntax = "proto3";

package cartographer.laser_perception.proto;

message LineDetectorXOptions {
  double least_thresh = 1;       // 正交拟合阈值
  double min_line_length = 2;    // 拟合线段最短长度 (m)
  double predict_distance = 3;   // 真实点与预测点的距离阈值 (m)
  int32 seed_line_points = 4;    // 种子线段包含的激光点数
  int32 min_line_points = 5;     // 一条线段最少包含的激光点数
}

message LaserPerceptionOptions {
  int32 min_cluster_points = 1;            // 聚类最少点数
  double min_range = 2;                    // 参与聚类的最小量程 (m)
  double max_range = 3;                    // 参与聚类的最大量程 (m)
  int32 highlight_intensity_threshold = 4; // 高亮(反光)点强度阈值
  double cluster_distance_threshold = 5;   // 聚类断开距离基数 (m)
  LineDetectorXOptions line_detector = 6;
}