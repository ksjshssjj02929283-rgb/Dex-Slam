syntax = "proto3";

package cartographer.localization.proto;

import "cartographer/mapping/proto/scan_matching/fast_correlative_scan_matcher_options_2d.proto";

// 一致性检查器配置选项
message ConsistencyCheckerOptions {
  // 位姿一致性阈值
  double translation_threshold = 1;  // 平移误差阈值 (米)，默认 0.05 (5cm)
  double rotation_threshold = 2;     // 旋转误差阈值 (弧度)，默认 0.524 (30度)
  
  // 速度阈值（用于检测异常运动）
  double max_linear_velocity = 3;    // 最大线速度 (m/s)，默认 2.0
  double max_angular_velocity = 4;   // 最大角速度 (rad/s)，默认 1.57 (90度/秒)
  
  // 匹配分数阈值
  double min_score = 5;              // 最小匹配分数阈值，默认 0.4

  // ===== 静态地图漂移门控（边定位边更新地图时拦截"自洽漂移"）=====
  // 原理：现有三路一致性信号都参照 odom 预测 + live local map（被同一漂移污染），
  // 对缓慢自洽漂移失明。这里引入漂移免疫的 global_static_submap_ 做独立锚点：
  // 漂移时 live 重合度仍高、但 static 重合度掉落，且独立再匹配出现位姿 delta。
  bool   enable_drift_gate    = 6;   // 是否启用静态地图漂移门控，默认 true
  double static_map_min_score = 7;   // static map 重合度 / 再匹配得分下限，默认 0.30
  double drift_score_gap      = 8;   // (live 重合度 - static 重合度) 触发指纹的最小差，默认 0.15
  double drift_trans_threshold = 9;  // 独立再匹配相对估计位姿的平移 delta 阈值 (m)，默认 0.12
  double drift_rot_threshold  = 10;  // 独立再匹配相对估计位姿的旋转 delta 阈值 (rad)，默认 0.105 (~6度)
  int32  drift_persist_frames = 11;  // 连续多少帧确认漂移才冻结地图(去抖)，默认 3

  // ===== 一致性/恢复现场快照（基础功能，默认开启）=====
  // 把「当前位姿下的点云」与「用于匹配的 local submap」叠加渲染成 PNG，
  // 让匹配失败从一个分数变成可直接看的图。PNG 编码在后台线程，主链路只付约 1-3 ms；
  // 只在一致性检查失败时产图，健康运行下不写盘。
  bool   debug_dump_enabled   = 12;  // 是否保存快照，默认 true
  string debug_dump_dir       = 13;  // 输出目录，空则 $HOME/.dexe/data/consistency_check
  int32  debug_dump_max_files = 14;  // 目录内保留的 PNG 上限（环形，超出删最早），默认 1000；<=0 不限
  int32  debug_dump_scale     = 15;  // 输出放大倍数，默认 2
  int32  debug_dump_point_radius = 16; // 雷达点半径(像素)，默认 2；0 = 单像素
  // 每帧匹配都存一张（不只失败时），落到 frames/ 子目录、独立环形区，
  // 不会把主目录里真正有价值的失败现场挤掉。开销大，仅排查期打开。
  bool   debug_dump_every_frame  = 17; // 默认 false

  // 恢复（RecoverFromLocalMap）用 FCSM 大窗口搜索；旧实现 RTCSM 0.2 m/15° 与检查容差同量级
  cartographer.mapping.scan_matching.proto.FastCorrelativeScanMatcherOptions2D fast_correlative_scan_matcher_options = 18;
}
