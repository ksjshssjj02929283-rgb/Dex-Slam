syntax = "proto3";

package cartographer.localization.proto;

// 置信度评估器配置选项
message ConfidenceEstimatorOptions {
  // ========== L1层: 扫描匹配内部权重 ==========
  double w_ceres = 1;
  double w_match_ratio = 2;
  double w_covariance = 3;
  
  // ========== 初始化阶段融合权重 ==========
  double init_w_scan_match = 4;    // 初始化阶段L1权重（推荐0.6）
  double init_w_motion = 5;         // 初始化阶段L2权重（推荐0.3）
  double init_w_map = 6;            // 初始化阶段L3权重（推荐0.1）
  double init_w_degeneracy = 7;     // 初始化阶段L4权重（推荐0.0）
  
  // ========== 正常运行阶段融合权重 ==========
  double normal_w_scan_match = 8;   // 正常阶段L1权重（推荐0.3）
  double normal_w_motion = 9;       // 正常阶段L2权重（推荐0.25）
  double normal_w_map = 10;         // 正常阶段L3权重（推荐0.35）
  double normal_w_degeneracy = 11;  // 正常阶段L4权重（推荐0.1）
  
  // ========== 置信度等级阈值 ==========
  double excellent_threshold = 12;  // >= 0.8
  double good_threshold = 13;       // >= 0.6
  double medium_threshold = 14;     // >= 0.4
  double poor_threshold = 15;       // >= 0.2
  
  // ========== 阶段切换时间 ==========
  double initialization_duration_sec = 16;  // 初始化阶段持续时间（秒）
  
  // ========== 各层使能开关 ==========
  // 注意: L1扫描匹配是基础评估层，始终启用，不需要配置开关
  bool enable_motion_check = 17;    // 启用运动一致性检查（L2）
  bool enable_map_check = 18;       // 启用地图一致性评估（L3）
  bool enable_degeneracy_check = 19; // 启用几何退化检测（L4）
}
