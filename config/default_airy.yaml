# 针对NCLT的配置
common:
  dataset: "mapping_3d"
  lidar_topic: "/rslidar/points"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/rslidar/imu"

# fasterlio 参数
fasterlio:
  lidar_type: 4                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for RoboSense M1 (AIRY)
  scan_line: 96
  blind: 0.5                # 盲区，小于盲区距离的不会处理
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

  lidar_process_interval: 3 # 每隔 N 帧处理一次（1=逐帧处理，N=每N帧处理1帧）
  kf_dis_th: 0.5    # 关键帧距离阈值（米），超过此值才建立新关键帧
  kf_angle_th: 15.0 # 关键帧角度阈值（度），超过此值才建立新关键帧
  point_filter_num: 4 # 点云采样参数
  max_iteration: 4 # 最大迭代次数（实测均值 ~4.17，与均值对齐）
  filter_size_scan: 0.3 # 对scan进行的降采样
  filter_size_map: 0.3

  # VoxelMap 参数（替代 ivox）
  voxel_map:
    voxel_size: 0.5                  # 顶层体素大小（米）- Livox 精度高，可以更小
    max_layer: 2                     # 八叉树最大层数
    layer_point_size: [10, 10, 10]      # 每层触发平面拟合的最小点数
    max_points_size: 500              # 每个体素最大点数
    max_cov_points_size: 500          # 保留协方差更新的最大点数
    planer_threshold: 0.01           # 平面判定阈值
    sigma_num: 3.0                   # sigma 倍数
    ranging_cov: 0.02                # Livox 测距方差更小
    angle_cov: 0.001                 # Livox 角度方差更小
    pub_max_voxel_layer: 0           # 可视化的最大体素层级
    pub_voxel_map: false              # 是否发布 VoxelMap 平面（可视化），false 时跳过 GetUpdatedPlanesForVis

  esti_plane_threshold: 0.1        # default=0.1

  # IVox 参数（与 VoxelMap 共同用于点面匹配定位）
  use_ivox: true                   # 是否启用 IVox 约束（前段）
  ivox_grid_resolution: 0.4        # IVox 体素大小（米），NEARBY6 时适当缩小体素补偿邻域减少
  ivox_nearby_type: 6              # 邻域类型: 0/6/18/26（改为6，kNN搜索降至37%，室内精度损失可忽略）
  ivox_range_delete: true           # 是否删除超出距离的 grid
  ivox_max_range: 100.0              # 保留 grid 的最大距离（米）

  use_voxel_map: false              # 是否启用 VoxelMap 约束（后段）

  use_aa: true  # use anderson-acceleration

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  extrinsic_T: [ 0.00425, 0.00418, -0.00446 ]
  extrinsic_R: [ -0.001724272, -0.999922808, -0.012304681,
                 -0.999996915,  0.001746142, -0.001766873,
                  0.001788222,  0.012301597, -0.999922734 ]
  keep_first_imu_estimation: false


g2p5:
  esti_floor: false   # 是否动态估计地面
  lidar_height: 0.0   # 雷达安装高度
  floor_height: -0.3   # 默认地面高度
  min_th_floor: 0.1  # 距离地面这个高度的障碍物被扫入栅格地图中
  max_th_floor: 1.0  # 距离地面这个高度的障碍物被扫入栅格地图中
  grid_map_resolution: 0.05 # 栅格地图分辨率
  build_nav_map: true                  # 是否对保存的地图做噪声过滤生成导航地图
  navigation_map_filter_mode: "normal"  # 滤波强度: "normal"(10), "high"(50), "super"(100)
  save_debug_map: false                 # 是否保存滤波中间结果（mask、连通域等）

system:
  with_loop_closing: true # 是否需要回环检测
  with_ui: true # 是否需要3D UI
  with_2dui: false # 是否需要2D UI
  with_g2p5: true # 是否需要栅格地图
  step_on_kf: false # 是否在关键帧处暂停
  func_point_interval: 3.0 # 轨迹功能点采样间隔（米）

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  pub_tf: true

rviz:
  enable: true
  pub_current_scan: true
  pub_local_map: true
  pub_global_map: true
  pub_trajectory: true
  pub_keyframes: true
  pub_loop_edges: true
  local_map_downsample: 5
  global_map_downsample: 10
  scan_rate: 10.0
  map_rate: 1.0

loop_closing:
  online_mode: true
  verbose: false
  loop_kf_gap: 10
  min_id_interval: 10
  closest_id_th: 5
  max_range: 10.0
  ndt_score_th: 1.0
  with_height: true
  height_noise: 0.1
  history_search_time_diff: 30.0
  max_candidates_per_check: 3      # 单次最多处理候选数，限制 GICP 峰值耗时
  history_keyframe_search_num: 15   # 子地图前后帧数（原25=51帧，改为15=31帧，-40%点数）
  icp_filter_size: 0.4              # 回环子地图降采样（原0.1m，改为0.4m，点数降~10x）
  min_cur_cloud_size: 300
  min_prev_cloud_size: 1000
  icp_fitness_score_th: 0.1
  icp_max_correspondence_dist: 0.5
  optimize_every_n_nodes: 10  # 每累积 N 个节点执行一次 PGO；有新回环时无条件触发（0 = 每帧都优化）
  fix_first_node: true        # 固定第一帧（anchor node），防止全局漂移


### localization ================================================================================================
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  enable_ivox_adjust: false          # 是否使用 IVox+GN 精化 NDT 结果
  ivox_adjust_res: 0.5               # IVox 精化下采样分辨率（米）
  ivox_adjust_max_iter: 4            # IVox 精化最大迭代次数
  ivox_adjust_max_dis: 0.5           # IVox 精化结果与 NDT 偏移超过此值则丢弃（米）
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 30.0
  use_rough_ndt_for_init: false      # 初始化角度搜索是否用粗分辨率NDT（小场景false，大场景true）
  lidar_loc_odom_th: 0.3
  init_with_fp: true
  min_init_confidence: 2.5
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 0.5
  height_min: -2.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
