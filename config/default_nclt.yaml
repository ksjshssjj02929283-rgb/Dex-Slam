# 针对NCLT的配置
common:
  dataset: "nclt"
  lidar_topic: "points_raw"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "imu_raw"

# fasterlio 参数
fasterlio:
  lidar_type: 2                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
  scan_line: 32
  blind: 0.5                # 盲区，小于盲区距离的不会处理
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

  skip_lidar_num: 0 # 点云的跳帧情况
  kf_dis_th: 2.0    # 关键帧距离阈值（米），超过此值才建立新关键帧
  kf_angle_th: 15.0 # 关键帧角度阈值（度），超过此值才建立新关键帧
  point_filter_num: 6 # 点云采样参数
  max_iteration: 6 # 最大迭代次数
  filter_size_scan: 0.5 # 对scan进行的降采样
  filter_size_map: 0.5

  # VoxelMap 参数（替代 ivox）
  voxel_map:
    voxel_size: 1.0
    max_layer: 2
    layer_point_size: [5, 5, 5]
    max_points_size: 50
    max_cov_points_size: 50
    planer_threshold: 0.01
    sigma_num: 3.0
    ranging_cov: 0.04
    angle_cov: 0.001
    pub_max_voxel_layer: 0
    pub_voxel_map: false              # 是否发布 VoxelMap 平面（可视化）

  esti_plane_threshold: 0.1        # default=0.1

  # IVox 参数（与 VoxelMap 共同用于点面匹配定位）
  use_ivox: true                   # 是否启用 IVox 约束（前段）
  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18

  use_voxel_map: true              # 是否启用 VoxelMap 约束（后段）

  use_aa: true  # use anderson-acceleration

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  extrinsic_T: [ 0, 0, 0.28 ]
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  keep_first_imu_estimation: false


g2p5:
  esti_floor: false   # 是否动态估计地面
  lidar_height: 0.0   # 雷达安装高度
  floor_height: -1.2   # 默认地面高度
  min_th_floor: 0.50  # 距离地面这个高度的障碍物被扫入栅格地图中
  max_th_floor: 1.0  # 距离地面这个高度的障碍物被扫入栅格地图中
  grid_map_resolution: 0.2 # 栅格地图分辨率
  build_nav_map: false                  # 是否对保存的地图做噪声过滤生成导航地图
  navigation_map_filter_mode: "normal"  # 滤波强度: "normal"(10), "high"(50), "super"(100)
  save_debug_map: false                 # 是否保存滤波中间结果（mask、连通域等）

system:
  with_loop_closing: true # 是否需要回环检测
  with_ui: true # 是否需要3D UI
  with_2dui: false # 是否需要2D UI
  with_g2p5: true # 是否需要栅格地图
  step_on_kf: false # 是否在关键帧处暂停

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: ./data/new_map/
  pub_tf: true

rviz:
  enable: true
  pub_current_scan: true
  pub_local_map: true
  pub_global_map: false
  pub_trajectory: true
  pub_keyframes: true
  pub_loop_edges: true
  local_map_downsample: 5
  global_map_downsample: 10
  scan_rate: 10.0
  map_rate: 1.0

loop_closing:
  loop_kf_gap: 50
  min_id_interval: 20
  closest_id_th: 50
  max_range: 30.0
  ndt_score_th: 1.0
  with_height: true
  height_noise: 1.0
  history_search_time_diff: 30.0
  max_candidates_per_check: 3
  history_keyframe_search_num: 25
  icp_filter_size: 0.4
  min_cur_cloud_size: 300
  min_prev_cloud_size: 1000
  icp_fitness_score_th: 0.3
  icp_max_correspondence_dist: 1.5
  optimize_every_n_nodes: 10  # 每累积 N 个节点执行一次 PGO；有新回环时无条件触发（0 = 每帧都优化）
  fix_first_node: true        # 固定第一帧（anchor node），防止全局漂移


### localization ================================================================================================
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 0.5
  height_min: -2.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
